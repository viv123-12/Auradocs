<div class="reset-password-container">
    <div class="reset-password-wrapper">
        <div class="reset-password-header">
            <div class="reset-header-logo-wrapper">
                <div class="set-password-header-bg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock text-blue-600" aria-hidden="true" data-source-pos="18:14-18:48" data-source-name="Lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
            </div>
            <h1 class="set-password-header">Set New Password</h1>
            <p class="set-password-desc">Create a strong password to secure your account</p>
        </div>
        <div class="reset-password-form">
            <form [formGroup]="resetPasswordForm">
                <div class="input-container">
                    <label for="password-textbox">New Password</label>
                    <div class="input-wrapper">
                        <input 
                        [type]="newPasswordType"
                        formControlName="password"
                        placeholder="password*"
                        id="password-textbox"
                        >
                        <button (click)="onClickNewPasswordShow()">
                            <svg *ngIf="!isNewPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye" aria-hidden="true" data-source-pos="52:56-52:73" data-source-name="Eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg *ngIf="isNewPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off" aria-hidden="true" data-source-pos="37:34-37:54" data-source-name="EyeOff"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
                        </button>
                    </div>
                    <div class="error-text" *ngIf="form['password']?.invalid && form['password']?.touched">password field is incorrect*</div>
                </div>
    
                <div class="input-container">
                    <label for="confirm-password-textbox">Confirm Password</label>
                    <div class="input-wrapper">
                        <input 
                        [type]="confirmPasswordType"
                        formControlName="confirmPassword"
                        placeholder="confirm password*"
                        id="confirm-password-textbox"
                        >
                        <button (click)="onClickConfirmPasswordShow()">
                            <svg *ngIf="isConfirmPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off" aria-hidden="true" data-source-pos="37:34-37:54" data-source-name="EyeOff"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
                            <svg *ngIf="!isConfirmPasswordVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye" aria-hidden="true" data-source-pos="52:56-52:73" data-source-name="Eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="error-text" *ngIf="form['confirmPassword']?.invalid && form['confirmPassword']?.touched">password field is incorrect*</div>
                </div>
            </form>
            <div class="password-notes">
                <ul>
                    <li>At least 8 characters</li>
                    <li>One uppercase letter</li>
                    <li>One number or special character</li>
                </ul>
            </div>
            <div class="update-password-btn" (click)="onClickUpdatePasswordBtn()">
                <app-button [btnClass]="updatePasswordBtnClass" [buttonTitle]="sendButtonTitle" [buttonInnerText]="sendButtonInnerText"></app-button>
            </div>
                <p>After updating, you’ll be redirected to login</p>
        </div>

    </div>
</div>
